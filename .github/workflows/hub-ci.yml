name: Hub CI

on:
  pull_request:
    branches: [agent-deck-hub-main]
  push:
    branches: [agent-deck-hub-main]
  workflow_dispatch:

concurrency:
  group: hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hub-build:
    name: hub-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Build upstream binary
        run: go build -o build/agent-deck ./cmd/agent-deck
      - name: Build Hub binary when target is available
        run: |
          if make -qp | grep -q '^build-hub:'; then
            make build-hub
            test -x build/agent-deck-hub
            test "$(basename build/agent-deck)" != "$(basename build/agent-deck-hub)"
          else
            echo 'Task 01 will add build-hub; upstream build verified for Task 00.'
          fi

  hub-tests:
    name: hub-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux zoxide
      - name: Run Hub-adjacent race tests
        env:
          PERF_BUDGET_MULTIPLIER: '2.0'
        run: |
          packages=(./cmd/agent-deck ./internal/ui ./internal/update)
          if go list ./internal/hub >/dev/null 2>&1; then
            packages+=(./internal/hub)
          fi
          go test -race -count=1 -timeout 15m "${packages[@]}"

  hub-security-contract:
    name: hub-security-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Run existing update security tests
        run: go test -race -count=1 ./internal/update ./cmd/agent-deck -run 'Update|Checksum|Version'
      - name: Run Hub security tests when package is available
        run: |
          if go list ./internal/hub >/dev/null 2>&1; then
            go test -race -count=1 ./internal/hub -run 'Security|Validate|Bound|Redact|Audit|Inject|Timeout'
          else
            echo 'Task 02 will add the Hub security package tests.'
          fi

  hub-diff:
    name: hub-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Check whitespace and generated CSS scope
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          git diff --check "$base" HEAD
          if git diff --name-only "$base" HEAD | grep -qx 'internal/web/static/styles.css'; then
            git diff --name-only "$base" HEAD | grep -qx 'internal/web/static/styles.src.css' || {
              echo 'Generated styles.css changed without styles.src.css.' >&2
              exit 1
            }
          fi
